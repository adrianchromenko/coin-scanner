# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → pick this repo. Render reads this
# file and creates the service. The only thing you must enter by hand is the
# ANTHROPIC_API_KEY value (it is marked sync: false so it never lives in git).
services:
  - type: web
    name: coinlens
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Public origin for canonical / share-preview URLs. Change this if you add a custom domain.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://coinlens-h71x.onrender.com
      # Firebase web config for accounts + "My coins" (Project settings -> Your apps -> Web app).
      # Set these in the Render dashboard; the build bakes them into the browser bundle.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # Scan access and limits. REQUIRE_SIGN_IN=1 needs the Firebase vars above.
      - key: REQUIRE_SIGN_IN
        value: "0"
      - key: DAILY_SCAN_LIMIT
        value: "25"
      - key: PRICE_SEARCH
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # eBay one-tap listing (optional). Leave blank to hide the button.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RU_NAME
        sync: false
      - key: EBAY_TOKEN_SECRET
        sync: false
      - key: EBAY_ENV
        value: sandbox
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_US
      - key: EBAY_POSTAL_CODE
        sync: false
