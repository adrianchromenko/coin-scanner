# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → pick this repo. Render reads this
# file and creates the service. The only thing you must enter by hand is the
# ANTHROPIC_API_KEY value (it is marked sync: false so it never lives in git).
services:
  - type: web
    name: coinlens
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Public origin for canonical / share-preview URLs. Change this if you add a custom domain.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://coinlens-h71x.onrender.com
      # Firebase web config for accounts + "My coins" (Project settings -> Your apps -> Web app).
      # Set these in the Render dashboard; the build bakes them into the browser bundle.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
